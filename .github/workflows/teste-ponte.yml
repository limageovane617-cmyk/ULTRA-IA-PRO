name: Testar Ponte Alex v2

on:
  workflow_dispatch:

jobs:
  teste-ponte:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testar cliente da Ponte Alex v2
        env:
          PONTE_API_SECRET: ${{ secrets.PONTE_API_SECRET }}
          PONTE_API_URL: https://ponte-alex-v2.dockhosting.dev
        run: |
          python teste_cliente_ponte.py

      - name: Testar camada de integracao da Ponte
        env:
          PONTE_API_SECRET: ${{ secrets.PONTE_API_SECRET }}
          PONTE_API_URL: https://ponte-alex-v2.dockhosting.dev
        run: |
          python teste_ponte_alex.py

      - name: Verificar importacao da Ponte no app
        env:
          PONTE_API_SECRET: ${{ secrets.PONTE_API_SECRET }}
          PONTE_API_URL: https://ponte-alex-v2.dockhosting.dev
        run: |
          python -c "import app; print('IMPORTACAO DO APP COM A PONTE: OK')"
